name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --console=plain > build.log 2>&1
          code=$?
          set -e
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            # Fehler als Hinweise ausgeben, damit sie im Actions-Tab direkt sichtbar sind
            msg=$( (grep -E '^e: |error:|What went wrong' -A3 build.log || tail -n 40 build.log) | head -n 120 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build-Fehler::$msg"
            exit 1
          fi
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Abendlicht.apk

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Abendlicht-APK
          path: out/Abendlicht.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Abendlicht ${{ github.run_number }}
          files: out/Abendlicht.apk
